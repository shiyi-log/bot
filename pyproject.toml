[project]
name = "telegram-tron-bot-template"
version = "0.1.0"
description = "Django API template for a Telegram bot and TRON address monitoring"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-filter>=25.1,<26",
    "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
