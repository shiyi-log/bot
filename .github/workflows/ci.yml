name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENABLE_TELEGRAM_NETWORK: "0"
  ENABLE_TELEGRAM_ACCOUNT_NETWORK: "0"
  ENABLE_TRON_NETWORK: "0"

jobs:
  backend:
    name: Django offline checks
    runs-on: [self-hosted, Linux, X64, repo-bot]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run Django tests
        run: uv run --no-sync python manage.py test botcore.tests

      - name: Run Django system checks
        run: uv run --no-sync python manage.py check

      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run

  frontend:
    name: Vben typecheck and build
    runs-on: [self-hosted, Linux, X64, repo-bot]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          package_json_file: frontend/package.json

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Vben
        run: pnpm --filter @vben/web-antd typecheck

      - name: Build Vben
        run: pnpm --filter @vben/web-antd build
